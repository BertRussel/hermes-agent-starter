name: Neutral public component checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    name: Portable components (not full-system acceptance)
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test-only dependency
        run: python -B -m pip --isolated install --disable-pip-version-check pytest==8.4.2
      - name: Run from a scrubbed empty owner home
        shell: bash
        run: |
          fixture=$(mktemp -d)
          mkdir "$fixture/home" "$fixture/tmp"
          env -i PATH="$PATH" LANG=C.UTF-8 HOME="$fixture/home" HERMES_HOME="$fixture/home/.hermes" TMPDIR="$fixture/tmp" PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python -B -m pytest -q -p no:cacheprovider tests/portable
